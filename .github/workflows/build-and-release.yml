name: Build and release Go backend

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "为版本创建一个标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.26.5"
  GOFLAGS: "-mod=mod"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve Go modules
        run: go mod download

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/vmqfox-api-linux-$arch" ./cmd/vmqfox-api
          done
          cp database/schema.sql env.example dist/
          tar -czf "vmqfox-backend-${{ inputs.tag_name }}.tar.gz" -C dist .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: vmqfox-backend-${{ inputs.tag_name }}.tar.gz