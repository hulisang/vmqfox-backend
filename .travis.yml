language: generic

branches:
  only:
    - refactor/go-single-user

env:
  global:
    - GO_VERSION=1.26.5
    - GOFLAGS=-mod=mod

install:
  - |
    set -eu
    curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
    sudo rm -rf /usr/local/go
    sudo tar -C /usr/local -xzf /tmp/go.tar.gz
    export PATH="/usr/local/go/bin:$PATH"
    go version

script:
  - export PATH="/usr/local/go/bin:$PATH"
  - go mod download
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" ./cmd/vmqfox-api