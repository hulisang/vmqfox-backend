language: generic

branches:
  only:
    - refactor/go-single-user

env:
  global:
    - GO_VERSION=1.26.5
    - NODE_VERSION=24
    - PNPM_VERSION=11.22.0
    - GOFLAGS=-mod=mod

install:
  - |
    set -eu
    curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
    sudo rm -rf /usr/local/go
    sudo tar -C /usr/local -xzf /tmp/go.tar.gz
    export PATH="/usr/local/go/bin:$PATH"
    go version
    # 前端资源会被 go:embed 嵌入二进制，必须先安装锁定依赖并构建
    nvm install "${NODE_VERSION}"
    nvm use "${NODE_VERSION}"
    corepack enable
    corepack prepare "pnpm@${PNPM_VERSION}" --activate
    (cd web && pnpm install --frozen-lockfile)

script:
  - export PATH="/usr/local/go/bin:$PATH"
  - (cd web && pnpm build)
  - |
    set -eu
    # 校验 index.html 引用的每个资源都真实存在，避免嵌入空壳前端
    out=internal/http/static/out
    test -f "$out/index.html"
    grep -oE '(src|href)="/assets/[^"]+"' "$out/index.html" \
      | sed -E 's#^[a-z]+="/assets/(.*)"$#\1#' \
      | sort -u > /tmp/referenced-assets.txt
    test -s /tmp/referenced-assets.txt
    while read -r asset; do
      test -f "$out/assets/$asset"
    done < /tmp/referenced-assets.txt
  - go mod download
  - go vet ./...
  - go test ./...
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" ./cmd/vmqfox-api
