services:
  # 前端容器自身负责静态资源与 SPA fallback，并将 API 转发到 backend:8000。
  vmqfox-frontend:
    image: ${VMQFOX_FRONTEND_IMAGE:-hulisang/vmqfox-frontend:latest}
    container_name: vmqfox-frontend
    ports:
      - "${VMQ_FRONTEND_PORT:-3006}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vmqfox-network

  # 对外兼容网关。保留 backend 服务名以兼容现有前端镜像的内部 upstream。
  backend:
    image: nginx:1.27-alpine
    container_name: vmqfox-backend-gateway
    ports:
      - "${VMQ_GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/http_upgrade_map.conf:/etc/nginx/conf.d/http_upgrade_map.conf:ro
    depends_on:
      vmqfox-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vmqfox-network

  # Go-only API；构建时固定 Go 1.26.5，运行时不执行 Schema 修改。
  vmqfox-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VMQFOX_BACKEND_IMAGE:-vmqfox-backend:go-dev}
    container_name: vmqfox-api
    restart: unless-stopped
    environment:
      VMQ_SERVER_HOST: 0.0.0.0
      VMQ_SERVER_PORT: 8080
      VMQ_SERVER_MODE: ${VMQ_SERVER_MODE:-release}
      VMQ_FRONTEND_URL: ${VMQ_FRONTEND_URL:-http://localhost:3006}
      VMQ_ALLOWED_ORIGIN: ${VMQ_ALLOWED_ORIGIN:-http://localhost:3006}
      VMQ_RUNTIME_MODE: ${VMQ_RUNTIME_MODE:-writer}
      VMQ_TOKEN_SECRET: ${VMQ_TOKEN_SECRET:?VMQ_TOKEN_SECRET must be set}
      VMQ_TOKEN_ISSUER: ${VMQ_TOKEN_ISSUER:?VMQ_TOKEN_ISSUER must be set}
      VMQ_TOKEN_TTL: ${VMQ_TOKEN_TTL:?VMQ_TOKEN_TTL must be set}
      VMQ_DB_HOST: ${VMQ_DB_HOST:-mysql}
      VMQ_DB_PORT: ${VMQ_DB_PORT:-3306}
      VMQ_DB_NAME: ${VMQ_DB_NAME:-vmq}
      VMQ_DB_USER: ${VMQ_DB_USER:-vmqfox}
      VMQ_DB_PASSWORD: ${VMQ_DB_PASSWORD:?VMQ_DB_PASSWORD must be set}
      VMQ_DB_CHARSET: ${VMQ_DB_CHARSET:-utf8mb4}
      VMQ_DB_MAX_OPEN_CONNS: ${VMQ_DB_MAX_OPEN_CONNS:-50}
      VMQ_DB_MAX_IDLE_CONNS: ${VMQ_DB_MAX_IDLE_CONNS:-10}
      VMQ_DB_CONN_MAX_LIFETIME: ${VMQ_DB_CONN_MAX_LIFETIME:-1h}
      VMQ_NOTIFICATION_POLL_INTERVAL: ${VMQ_NOTIFICATION_POLL_INTERVAL:-2s}
      VMQ_NOTIFICATION_ATTEMPT_TIMEOUT: ${VMQ_NOTIFICATION_ATTEMPT_TIMEOUT:-30s}
      VMQ_NOTIFICATION_LEASE_DURATION: ${VMQ_NOTIFICATION_LEASE_DURATION:-45s}
      VMQ_NOTIFICATION_BATCH_SIZE: ${VMQ_NOTIFICATION_BATCH_SIZE:-20}
      VMQ_LIFECYCLE_POLL_INTERVAL: ${VMQ_LIFECYCLE_POLL_INTERVAL:-10s}
      VMQ_LIFECYCLE_ATTEMPT_TIMEOUT: ${VMQ_LIFECYCLE_ATTEMPT_TIMEOUT:-10s}
      VMQ_LIFECYCLE_BATCH_SIZE: ${VMQ_LIFECYCLE_BATCH_SIZE:-100}
      VMQ_MONITOR_HEARTBEAT_TIMEOUT: ${VMQ_MONITOR_HEARTBEAT_TIMEOUT:-3m}
      VMQ_MONITOR_SIGN_TTL: ${VMQ_MONITOR_SIGN_TTL:-5m}
      VMQ_RATE_LOGIN_LIMIT: ${VMQ_RATE_LOGIN_LIMIT:-10}
      VMQ_RATE_LOGIN_WINDOW: ${VMQ_RATE_LOGIN_WINDOW:-1m}
      VMQ_RATE_CREATE_LIMIT: ${VMQ_RATE_CREATE_LIMIT:-30}
      VMQ_RATE_CREATE_WINDOW: ${VMQ_RATE_CREATE_WINDOW:-1m}
      VMQ_RATE_PUBLIC_READ_LIMIT: ${VMQ_RATE_PUBLIC_READ_LIMIT:-60}
      VMQ_RATE_PUBLIC_READ_WINDOW: ${VMQ_RATE_PUBLIC_READ_WINDOW:-1m}
      VMQ_RATE_PUBLIC_TOKEN_LIMIT: ${VMQ_RATE_PUBLIC_TOKEN_LIMIT:-60}
      VMQ_RATE_PUBLIC_TOKEN_WINDOW: ${VMQ_RATE_PUBLIC_TOKEN_WINDOW:-1m}
      VMQ_RATE_QRCODE_LIMIT: ${VMQ_RATE_QRCODE_LIMIT:-30}
      VMQ_RATE_QRCODE_WINDOW: ${VMQ_RATE_QRCODE_WINDOW:-1m}
      VMQ_RATE_MONITOR_HEART_LIMIT: ${VMQ_RATE_MONITOR_HEART_LIMIT:-120}
      VMQ_RATE_MONITOR_HEART_WINDOW: ${VMQ_RATE_MONITOR_HEART_WINDOW:-1m}
      VMQ_RATE_MONITOR_PUSH_LIMIT: ${VMQ_RATE_MONITOR_PUSH_LIMIT:-60}
      VMQ_RATE_MONITOR_PUSH_WINDOW: ${VMQ_RATE_MONITOR_PUSH_WINDOW:-1m}
      # 仅在此处填写实际反向代理网段；留空时 API 只信任 TCP 对端地址，安全但会把网关后的客户端合并限流。
      VMQ_TRUSTED_PROXY_CIDR: ${VMQ_TRUSTED_PROXY_CIDR:-}
      VMQ_NOTIFY_ALLOW_CIDR: ${VMQ_NOTIFY_ALLOW_CIDR:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vmqfox-network

  # 仅在空数据卷首次初始化时执行 database/schema.sql；不会插入管理员凭据。
  mysql:
    image: mysql:5.7
    container_name: vmqfox-mysql
    ports:
      - "127.0.0.1:${VMQ_MYSQL_PORT:-3306}:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${VMQ_DB_NAME:-vmq}
      MYSQL_USER: ${VMQ_DB_USER:-vmqfox}
      MYSQL_PASSWORD: ${VMQ_DB_PASSWORD:?VMQ_DB_PASSWORD must be set}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      timeout: 5s
      retries: 12
      interval: 10s
      start_period: 30s
    networks:
      - vmqfox-network

volumes:
  mysql_data:
    driver: local

networks:
  vmqfox-network:
    driver: bridge
