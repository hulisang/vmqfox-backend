# 可选的外部反向代理示例。
#
# 单服务模型下 Go 进程已同时提供 /（嵌入的 React 前端）、/assets 与 /api，
# 因此这里只做纯转发，不再区分前端容器与 API 容器，也不再注入任何 CORS 头。
# 安全响应头与 CSP 由 Go 的 SecurityHeaders 中间件统一下发，避免两层重复或冲突。
#
# docker-compose.yml 默认不启用本文件；仅在需要独立入口终止 TLS 时挂载使用。

upstream vmqfox_api {
    server vmqfox-api:8080;
    keepalive 16;
}

# 公开支付 URL 中的令牌是 bearer 凭据；访问日志仅记录脱敏路径且不记录查询参数。
map $uri $vmqfox_log_path {
    ~^/api/order/(?:get|check|return-url)/ /api/order/[redacted-token];
    default $uri;
}

log_format vmqfox_access '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $vmqfox_log_path $server_protocol" $status $body_bytes_sent '
                         '"$http_user_agent"';

server {
    listen 8000;
    server_name _;

    client_max_body_size 9m;
    access_log /var/log/nginx/access.log vmqfox_access;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Go 侧据此决定是否下发 HSTS，必须反映客户端到入口的真实协议
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_read_timeout 35s;

    # 健康与就绪检查必须反映 Go API 的真实状态，而不是网关自身状态。
    location = /health {
        access_log off;
        proxy_pass http://vmqfox_api;
    }

    location = /ready {
        access_log off;
        proxy_pass http://vmqfox_api;
    }

    # 前端资源、公开收银台、管理台与 API 全部由同一个 Go 服务提供。
    location / {
        proxy_pass http://vmqfox_api;
    }
}
