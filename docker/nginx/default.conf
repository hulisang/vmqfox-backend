upstream vmqfox_api {
    server vmqfox-api:8080;
    keepalive 16;
}

server {
    listen 8000;
    server_name _;

    client_max_body_size 9m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_read_timeout 35s;

    # 健康与就绪检查必须反映 Go API 的真实状态，而不是网关自身状态。
    location = /health {
        access_log off;
        proxy_pass http://vmqfox_api;
    }

    location = /ready {
        access_log off;
        proxy_pass http://vmqfox_api;
    }

    # API、历史根路径和管理路径全部交给 Go；不再 rewrite 到 PHP-FPM。
    location /api/ {
        proxy_pass http://vmqfox_api;
    }

    location = /api {
        proxy_pass http://vmqfox_api;
    }

    location /admin/ {
        proxy_pass http://vmqfox_api;
    }

    location = /admin {
        proxy_pass http://vmqfox_api;
    }

    location /index/ {
        proxy_pass http://vmqfox_api;
    }

    location ~ ^/(appHeart|appPush|enQrcode|createOrder|getOrder|checkOrder|closeOrder|getState|login|getMenu|closeEndOrder|getMain)(/|$) {
        proxy_pass http://vmqfox_api;
    }

    # 其余请求也交给 Go，由路由器给出根状态或明确的 404；SPA 由前端容器自身提供。
    location / {
        proxy_pass http://vmqfox_api;
    }
}